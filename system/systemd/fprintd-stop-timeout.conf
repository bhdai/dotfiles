[Service]
# A wedged fprintd can refuse SIGTERM until systemd gives up and kills it. At the 90s
# default that outlasts the lock screen's fingerprint retry budget (2s/5s/10s, then the
# chip latches absent for the rest of the lock session), so the resume hook would clear
# the stale device only after the shell had already stopped asking for it.
TimeoutStopSec=5s
