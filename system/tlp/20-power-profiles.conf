# Automatic TLP profile per power source (PRF=performance, BAL=balanced, SAV=power-saver).
# Stock defaults are PRF on AC and BAL on battery; drop to SAV unplugged for runtime.
# TLP_AUTO_SWITCH stays at its default of 2 (smart), so a manual profile change
# survives until the next AC/battery transition.
TLP_PROFILE_BAT=SAV
