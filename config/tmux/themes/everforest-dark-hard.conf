# Everforest dark, hard contrast -- https://github.com/sainnhe/everforest
#
# tmux.conf draws with these names only, so switching themes is a matter of
# sourcing a different file that defines the same set. Most names are hues, but
# a scheme also picks which hue carries "this is yours/current" -- that one is
# @thm_accent, because it differs per scheme and is not derivable from a hue.
#
# Style options in tmux.conf are set with `set -gF`: a style string is not
# format-expanded when it is drawn, so these have to be substituted at load time.

set -g @thm_bg_dim "#1e2326"    # bg_dim -- status bar, one step below the terminal background
set -g @thm_bg_popup "#374145"  # bg2 -- message and command prompt background
set -g @thm_bg_visual "#4c3743" # bg_visual -- copy-mode selection
set -g @thm_border "#495156"    # bg4 -- what the colorscheme uses for window splits

set -g @thm_fg "#d3c6aa"
set -g @thm_grey "#7a8478"        # grey0 -- inactive windows, clock
set -g @thm_grey_bright "#859289" # grey1 -- status bar text

set -g @thm_accent "#a7c080"        # green -- the colorscheme's statusline1
set -g @thm_border_active "#a7c080"

set -g @thm_red "#e67e80"
set -g @thm_orange "#e69875"
set -g @thm_yellow "#dbbc7f"
set -g @thm_aqua "#83c092"
set -g @thm_blue "#7fbbb3"
