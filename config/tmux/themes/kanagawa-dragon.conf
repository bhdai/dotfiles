# Kanagawa dragon -- https://github.com/rebelot/kanagawa.nvim
#
# See everforest-dark-hard.conf for what each name is used for. Upstream palette
# names are in the trailing comments.
#
# Surfaces and text come from the dragon* palette, but the attention markers take
# dragon's *bright* terminal colours: dragon is deliberately desaturated, and a
# marker drawn in the muted range does not read as a signal against pane content.

set -g @thm_bg_dim "#0d0c0c"    # dragonBlack0
set -g @thm_bg_popup "#223249"  # waveBlue1 -- dragon keeps the wave blues for floats
set -g @thm_bg_visual "#2d4f67" # waveBlue2 -- and for search/selection
set -g @thm_border "#282727"    # dragonBlack4

set -g @thm_fg "#c5c9c5"          # dragonWhite
set -g @thm_grey "#737c73"        # dragonAsh -- the comment colour
set -g @thm_grey_bright "#a6a69c" # dragonGray

set -g @thm_accent "#8ba4b0"        # dragonBlue2
set -g @thm_border_active "#658594" # dragonBlue -- muted, so an active split does
                                    # not compete with the status bar

set -g @thm_red "#e46876"    # waveRed
set -g @thm_orange "#b6927b" # dragonOrange
set -g @thm_yellow "#e6c384" # carpYellow
set -g @thm_aqua "#7aa89f"   # waveAqua2
set -g @thm_blue "#7fb4ca"   # springBlue
