# Gruvbox Material dark, hard contrast, material foreground
# https://github.com/sainnhe/gruvbox-material
#
# See everforest-dark-hard.conf for what each name is used for. Upstream palette
# names are in the trailing comments.

set -g @thm_bg_dim "#141617"    # bg_dim
set -g @thm_bg_popup "#3c3836"  # bg3 -- the colorscheme's Pmenu background
set -g @thm_bg_visual "#2e3b3b" # bg_visual_blue -- matches the Visual the Neovim
                                # config selects, so a copy-mode selection and an
                                # nvim one are the same colour
set -g @thm_border "#504945"    # bg5

set -g @thm_fg "#d4be98"          # fg0
set -g @thm_grey "#7c6f64"        # grey0
set -g @thm_grey_bright "#a89984" # grey2 -- legible against the dimmed bar

set -g @thm_accent "#a9b665"        # green -- the colorscheme's statusline1
set -g @thm_border_active "#a9b665"

set -g @thm_red "#ea6962"
set -g @thm_orange "#e78a4e"
set -g @thm_yellow "#d8a657"
set -g @thm_aqua "#89b482"
set -g @thm_blue "#7daea3"
