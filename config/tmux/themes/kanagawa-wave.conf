# Kanagawa wave -- https://github.com/rebelot/kanagawa.nvim
#
# See everforest-dark-hard.conf for what each name is used for. Upstream palette
# names are in the trailing comments.

set -g @thm_bg_dim "#16161d"    # sumiInk0
set -g @thm_bg_popup "#223249"  # waveBlue1 -- the colorscheme's float background
set -g @thm_bg_visual "#2d4f67" # waveBlue2 -- its visual selection
set -g @thm_border "#2a2a37"    # sumiInk4

set -g @thm_fg "#dcd7ba"          # fujiWhite
set -g @thm_grey "#727169"        # fujiGray
set -g @thm_grey_bright "#c8c093" # oldWhite

set -g @thm_accent "#7e9cd8"        # crystalBlue
set -g @thm_border_active "#658594" # dragonBlue -- a muted blue, so an active split
                                    # reads without competing with the status bar

set -g @thm_red "#ff5d62"    # peachRed
set -g @thm_orange "#ffa066" # surimiOrange
set -g @thm_yellow "#ff9e3b" # roninYellow -- the diagnostic warning hue, not carpYellow
set -g @thm_aqua "#7aa89f"   # waveAqua2
set -g @thm_blue "#7fb4ca"   # springBlue
