set -g default-terminal "tmux-256color"
set-option -a terminal-features "tmux-256color:RGB"

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

### Basic setting
unbind C-b
set-option -g prefix C-a
set -sg escape-time 10
set -g mouse on

### Window and Pane settings
set -g renumber-windows on # make sure the window numbers are always sequential without gaps
set -g base-index 1 # start with window number 1
setw -g monitor-activity on # notify if there is an activity in an inative window


### Key bindings

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind i

# make copy mode more vim-like
bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle

# new window with the same cwd as current window
bind-key c new-window -c "#{pane_current_path}"

# kill pane without confirmation
unbind-key x
bind-key x kill-pane

# resize panes with vim keys
bind-key -r C-h resize-pane -L 1
bind-key -r C-j resize-pane -D 1
bind-key -r C-k resize-pane -U 1
bind-key -r C-l resize-pane -R 1


bind-key -r M-h resize-pane -L 5
bind-key -r M-j resize-pane -D 5
bind-key -r M-k resize-pane -U 5
bind-key -r M-l resize-pane -R 5

# move between panes with vim keys
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# last window
bind-key Tab last-window

# Project switcher popup (tm)
bind-key T display-popup -E -w 80% -h 80% "fish -c tm"

### Colors and Styles

# Tokyonight night palette, matching the ghostty theme. The bar sits one step
# darker than the terminal background (#1a1b26) so it reads as a recessed
# surface instead of competing with pane content.
set -g status-style "bg=#16161e,fg=#787c99"
set -g status-justify left

set -g status-left "#[fg=#7aa2f7,bold] #S #[default]"
set -g status-left-length 30

# The leading title fragment is copied verbatim from tmux's default status-right:
# the quotes are literal, and the conditional shows the viewport offset only when
# the window is larger than the client. `#,` is an escaped comma, which would
# otherwise terminate the conditional's true branch.
#
# #{prefix_highlight} is the placeholder tmux-prefix-highlight substitutes into;
# without it here the plugin has nothing to attach to and silently does nothing.
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" #{prefix_highlight}#[fg=#565f89]%H:%M #[fg=#787c99] #h "
set -g status-right-length 70

setw -g window-status-format "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I #W "
setw -g window-status-activity-style "fg=#e0af68,none"
setw -g window-status-separator ""

set -g @prefix_highlight_fg '#16161e'
set -g @prefix_highlight_bg '#e0af68'

# Since tmux 3.7 the prompt is drawn over the status line rather than replacing
# it, and only `fill` clears what is underneath; without it the bar shows
# through whatever is typed at the prompt.
set -g message-style "bg=#24283b,fg=#c0caf5,fill=#24283b"
set -g message-command-style "bg=#24283b,fg=#7aa2f7,fill=#24283b"

set -g mode-style "bg=#3b4261,fg=#c0caf5"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#3d59a1"

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

set-option -g set-titles on
set-option -g set-titles-string "#T"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum & tmux-resurrecrt
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
