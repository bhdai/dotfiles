set -g default-terminal "tmux-256color"
set-option -a terminal-features "tmux-256color:RGB"

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

### Basic setting
unbind C-b
set-option -g prefix C-a
set -sg escape-time 10
set -g mouse on

### Window and Pane settings
set -g renumber-windows on # make sure the window numbers are always sequential without gaps
set -g base-index 1 # start with window number 1
setw -g monitor-activity on # notify if there is an activity in an inative window


### Key bindings

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind i

# make copy mode more vim-like
bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle

# new window with the same cwd as current window
bind-key c new-window -c "#{pane_current_path}"

# kill pane without confirmation
unbind-key x
bind-key x kill-pane

# resize panes with vim keys
bind-key -r C-h resize-pane -L 1
bind-key -r C-j resize-pane -D 1
bind-key -r C-k resize-pane -U 1
bind-key -r C-l resize-pane -R 1


bind-key -r M-h resize-pane -L 5
bind-key -r M-j resize-pane -D 5
bind-key -r M-k resize-pane -U 5
bind-key -r M-l resize-pane -R 5

# move between panes with vim keys
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# last window
bind-key Tab last-window

# Project switcher popup (tm)
bind-key T display-popup -E -w 80% -h 80% "fish -c tm"

# Session switcher, overriding the default binding only to add attention and agent
# markers (see attention/README.md). The three branches mirror tmux's own default
# format: choose-tree evaluates one format for every row and #{?pane_format,...} /
# #{?window_format,...} is how a row says which kind it is. Sessions stay collapsed,
# so the session-level rollup is what makes a waiting agent visible without
# expanding the tree. Each marker guards itself and brings its own leading space, so
# there is nothing to say here about when one applies.
bind-key s choose-tree -Zs -F "#{?pane_format,#{pane_current_command}#{E:@att_marker_pane}#{E:@att_marker_agent_pane},#{?window_format,#{window_name}#{window_flags}#{E:@att_marker_win}#{E:@att_marker_agent_win},#{session_name}: #{session_windows} windows#{?session_attached, (attached),}#{E:@att_marker_sess}#{E:@att_marker_agent_sess}}}"

### Colors and Styles

# Every colour below comes from the sourced theme; nothing here names a hex value,
# so switching schemes is one path change. Style options need `set -gF` -- a style
# string is not format-expanded when it is drawn, unlike the format options
# (status-left, window-status-format, the markers) which resolve #{@thm_*} live.
source-file ~/.config/tmux/themes/gruvbox-material-dark.conf

# The bar sits one step darker than the terminal background so it reads as a
# recessed surface instead of competing with pane content.
set -gF status-style "bg=#{@thm_bg_dim},fg=#{@thm_grey_bright}"
set -g status-justify left

set -g status-left "#[fg=#{@thm_accent},bold] #S #[default]"
set -g status-left-length 30

# The leading title fragment is copied verbatim from tmux's default status-right:
# the quotes are literal, and the conditional shows the viewport offset only when
# the window is larger than the client. `#,` is an escaped comma, which would
# otherwise terminate the conditional's true branch.
#
# #{prefix_highlight} is the placeholder tmux-prefix-highlight substitutes into;
# without it here the plugin has nothing to attach to and silently does nothing.
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" #{prefix_highlight}#[fg=#{@thm_grey}]%H:%M #[fg=#{@thm_grey_bright}] #h "
set -g status-right-length 70

### Attention markers (see attention/README.md)

# attentiond writes the state name and a count; the markers turn it into a glyph.
# #{E:...} expands an option's value as a format, which is what lets one marker
# definition serve both the status line and choose-tree -- and is also why the
# #{@thm_*} references below survive being set, resolving on the same pass.
#
# Rollups show the highest-severity state in the window or session -- blocked
# outranks error because blocked is the only state where you are the bottleneck --
# and append a count only when more than one pane shares it.
#
# ◉ ringed for blocked, ▲ for error: a failed command is not a degree of the same
# thing, so it does not take a dot.
#
# `done` draws nothing here, though it still colours the status line. It is set by
# exactly one caller -- an agent finishing its turn -- which is the same event that
# sets the agent axis to `idle`, so drawing both put two markers on the row for one
# thing. The agent axis wins that tie: it is the durable statement, and it does not
# vanish the moment you visit the pane.
#
# `blocked` loses that same tie to `waiting`, which is why the dot is suppressed on
# a row whose agent axis reads waiting. One hook sets both, so the two glyphs only
# ever arrived together, and a row reading ◉ ✻ is one thing marked twice. An
# ordinary prompt keeps its dot: nothing draws the agent axis there.
#
# Each marker carries its own leading space and renders empty when it has nothing
# to say, so a state that draws no glyph leaves no gap behind either.
set -g @att_marker_win "#{?#{==:#{@att_win},error}, #[fg=#{@thm_yellow}]▲#{?#{>:#{@att_win_n},1},#{@att_win_n},},#{?#{&&:#{==:#{@att_win},blocked},#{!=:#{@att_agent_win},waiting}}, #[fg=#{@thm_red}]◉#{?#{>:#{@att_win_n},1},#{@att_win_n},},}}"
set -g @att_marker_sess "#{?#{==:#{@att_sess},error}, #[fg=#{@thm_yellow}]▲#{?#{>:#{@att_sess_n},1},#{@att_sess_n},},#{?#{&&:#{==:#{@att_sess},blocked},#{!=:#{@att_agent_sess},waiting}}, #[fg=#{@thm_red}]◉#{?#{>:#{@att_sess_n},1},#{@att_sess_n},},}}"
set -g @att_marker_pane "#{?#{==:#{@att_state},error}, #[fg=#{@thm_yellow}]▲,#{?#{&&:#{==:#{@att_state},blocked},#{!=:#{@att_agent},waiting}}, #[fg=#{@thm_red}]◉,}}"

# The agent axis: what the agent in the pane is doing, which is not cleared by
# looking at it. These live in choose-tree only -- the status line deliberately
# says nothing about it, so the bar keeps meaning "something wants you" and stays
# empty the rest of the time.
#
# One glyph, ✻, carries all three states and hue carries which: green finished,
# yellow wants an answer, and a blue pulse while the turn runs. That is the shape
# the agents themselves use for "thinking", so the row reads without a legend. It
# still cannot be confused with the attention axis, whose dots and triangle land
# on the same row -- a waiting agent is `blocked` and `waiting` in the same moment,
# and only the blocked half clears when you visit.
#
# The working frame is read out of @att_spin rather than written here: attentiond
# advances it, and this value is the one shown when nothing is animating, so a
# stopped daemon degrades to a static ✻ instead of an empty column.
set -g @att_spin "✻"
set -g @att_marker_agent_win "#{?#{==:#{@att_agent_win},waiting}, #[fg=#{@thm_yellow}]✻,#{?#{==:#{@att_agent_win},working}, #[fg=#{@thm_blue}]#{@att_spin},#{?#{==:#{@att_agent_win},idle}, #[fg=#{@thm_aqua}]✻,}}}#{?#{>:#{@att_agent_win_n},1},#{@att_agent_win_n},}"
set -g @att_marker_agent_sess "#{?#{==:#{@att_agent_sess},waiting}, #[fg=#{@thm_yellow}]✻,#{?#{==:#{@att_agent_sess},working}, #[fg=#{@thm_blue}]#{@att_spin},#{?#{==:#{@att_agent_sess},idle}, #[fg=#{@thm_aqua}]✻,}}}#{?#{>:#{@att_agent_sess_n},1},#{@att_agent_sess_n},}"
set -g @att_marker_agent_pane "#{?#{==:#{@att_agent},waiting}, #[fg=#{@thm_yellow}]✻,#{?#{==:#{@att_agent},working}, #[fg=#{@thm_blue}]#{@att_spin},#{?#{==:#{@att_agent},idle}, #[fg=#{@thm_aqua}]✻,}}}"

# On the status line the state recolours the window entry instead of adding a glyph,
# so the bar keeps one visual vocabulary. Bold still means "current" and colour means
# state, which cannot collide in practice: a window you are looking at has its state
# cleared within a second, so "current and blocked" does not persist.
#
# Hue carries the urgency -- red for blocked, yellow for error, teal for done --
# which is why blocked needs no extra weight to read as the loud one. It is the same
# hue per state as the markers above, so a state does not change colour depending on
# which surface you read it from. The commas inside #[...] are escaped as #, because
# an unescaped one would end the conditional branch it sits in.
set -g @att_style_win "#{?#{==:#{@att_win},blocked},#[fg=#{@thm_red}],#{?#{==:#{@att_win},error},#[fg=#{@thm_yellow}],#{?#{==:#{@att_win},done},#[fg=#{@thm_aqua}],}}}"

setw -g window-status-format "#[fg=#{@thm_grey}]#{?#{@att_win},#{E:@att_style_win},} #I #W "
setw -g window-status-current-format "#[fg=#{@thm_accent},bold]#{?#{@att_win},#{E:@att_style_win}#[bold],} #I #W "
setw -gF window-status-activity-style "fg=#{@thm_yellow},none"
setw -g window-status-separator ""

set -gF @prefix_highlight_fg "#{@thm_bg_dim}"
set -gF @prefix_highlight_bg "#{@thm_yellow}"

# Since tmux 3.7 the prompt is drawn over the status line rather than replacing
# it, and only `fill` clears what is underneath; without it the bar shows
# through whatever is typed at the prompt.
set -gF message-style "bg=#{@thm_bg_popup},fg=#{@thm_fg},fill=#{@thm_bg_popup}"
set -gF message-command-style "bg=#{@thm_bg_popup},fg=#{@thm_accent},fill=#{@thm_bg_popup}"

set -gF mode-style "bg=#{@thm_bg_visual},fg=#{@thm_fg}"
set -gF pane-border-style "fg=#{@thm_border}"
set -gF pane-active-border-style "fg=#{@thm_border_active}"

# pane number display
set-option -gF display-panes-active-colour "#{@thm_blue}"
set-option -gF display-panes-colour "#{@thm_orange}"

# clock
set-window-option -gF clock-mode-colour "#{@thm_accent}"

set-option -g set-titles on
set-option -g set-titles-string "#T"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum & tmux-resurrecrt
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
