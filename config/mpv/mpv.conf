save-position-on-quit=yes
write-filename-in-watch-later-config=yes
save-watch-history=yes

# Prefer these subtitle/audio languages when a file has several tracks.
slang=en,vi

# Lift subtitles clear of burned-in (hardcoded) subtitles.
# Not auto-applied: toggle with b / Shift+b, or launch with --profile=hardsub-lift
# profile-restore lets mpv put the old values back when the profile is undone.
[hardsub-lift]
profile-desc=Lift subs above burned-in subtitles
profile-restore=copy-equal
sub-pos=90
sub-border-style=background-box
sub-back-color="#C0000000"
sub-font-size=40
sub-outline-size=3
