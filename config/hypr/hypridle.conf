# `auto` resolves to 1 ("wait for before_sleep_cmd") here, because hypridle picks
# between 1 and 3 by detecting whether hyprlock is launched before sleep — and this
# config's pre-sleep command is `loginctl lock-session`. The inhibitor would drop the
# moment loginctl returns, before anything is on screen. Pinning to 3 waits for a
# compositor-confirmed session lock instead. Cost: it disables the lock/unlock hooks,
# neither of which is used here.
general {
    inhibit_sleep = 3
    # qs-call gives `qs ipc call` an exit status that can be trusted, and --expect
    # holds it to the returned value: a shell that declined to lock is as much a
    # failure here as one that never loaded the module. This is the one place a
    # hyprlock fallback is real — the shell is already dead when the lock is
    # requested, so nothing holds the lock yet. `pidof` prevents a double launch.
    # A missing or non-executable qs-call exits 127, which is non-zero, so the
    # screen still locks.
    lock_cmd = $HOME/.config/hypr/scripts/qs-call lock lock --expect true || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

